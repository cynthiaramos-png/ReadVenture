{% extends "base.html" %}
{% block contenido %}
<div class="caja formulario">
  <h1>Crear cuenta</h1>

  {% if error %}<p class="error">{{ error }}</p>{% endif %}

  <form method="post">
    <label for="usuario">Usuario (sin espacios)</label>
    <input type="text" id="usuario" name="usuario" required minlength="3" maxlength="20"
           autocomplete="username" value="{{ request.form.usuario }}">

    <label for="password">Contraseña (mínimo 6 caracteres)</label>
    <input type="password" id="password" name="password" required minlength="6" autocomplete="new-password">

    <button type="submit" class="boton">Registrarme</button>
  </form>

  <p>¿Ya tienes cuenta? <a href="{{ url_for('login') }}">Inicia sesión</a></p>
</div>
{% endblock %}

<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ReadVenture</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/estilos.css') }}">
</head>
<body>
  <header class="barra">
    <a class="logo" href="{{ url_for('index') }}">ReadVenture</a>
    {% if session.usuario_id %}
    <nav>
      <a href="{{ url_for('inicio') }}" class="{{ 'activo' if request.endpoint == 'inicio' }}">Inicio</a>
      <a href="{{ url_for('perfil') }}" class="{{ 'activo' if request.endpoint == 'perfil' }}">Perfil</a>
    </nav>
    {% endif %}
  </header>

  <main class="contenedor">
    {% block contenido %}{% endblock %}
  </main>
</body>
</html>

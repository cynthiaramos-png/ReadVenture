{% extends "base.html" %}
{% block contenido %}
<div class="caja formulario">
  <h1>Conoce a tu chango</h1>
  <p>Hola, {{ usuario.usuario }}. Ponle nombre a tu chango y elige al menos dos tipos de lectura.</p>

  {% if error %}<p class="error">{{ error }}</p>{% endif %}

  <form method="post">
    <label for="nombre_chango">Nombre de tu chango</label>
    <input type="text" id="nombre_chango" name="nombre_chango" maxlength="30"
           value="{{ usuario.nombre_chango }}" placeholder="Chango">

    <p class="etiqueta">¿Qué te gusta leer?</p>
    {% for clave, nombre in categorias.items() %}
    <label class="opcion">
      <input type="checkbox" name="categorias" value="{{ clave }}" {% if clave in actuales %}checked{% endif %}>
      {{ nombre }}
    </label>
    {% endfor %}

    <button type="submit" class="boton">Empezar a leer</button>
  </form>
</div>
{% endblock %}
